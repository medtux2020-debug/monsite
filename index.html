  <style>
:root{--bg:#1a0f0a;--bg2:#241510;--card:#2e1c14;--red:#e8402a;--gold:#ffc233;--gold2:#ffe08a;--text:#fff4e2;--muted:#cdb9a5;--radius:20px}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;overflow-x:hidden}
html[lang=ar] body,html[lang=ar] h1,html[lang=ar] h2,html[lang=ar] h3,html[lang=ar] .brand,html[lang=ar] button,html[lang=ar] .eyebrow,html[lang=ar] .marquee{font-family:'Cairo',sans-serif}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
ul{list-style:none}
.container{width:min(1100px,92%);margin:auto}
.section{padding:100px 0}
h1,h2,h3{font-family:'Playfair Display',serif;line-height:1.2}
.eyebrow{color:var(--gold);letter-spacing:.3em;text-transform:uppercase;font-size:.78rem;font-weight:600;margin-bottom:8px}
html[lang=ar] .eyebrow{letter-spacing:0;font-size:.95rem}
.head{text-align:center;margin-bottom:46px}
.head h2{font-size:clamp(2rem,4.5vw,3.1rem)}
.head h2::after{content:"✦";display:block;color:var(--gold);font-size:1rem;margin-top:12px;letter-spacing:.5em}
.sub{color:var(--muted);margin-top:8px}

.btn{display:inline-block;background:linear-gradient(135deg,var(--red),#ff7a45);color:#fff;padding:14px 32px;border-radius:50px;font-weight:600;border:2px solid transparent;transition:.3s;cursor:pointer}
.btn:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(232,64,42,.45)}
.btn-outline{background:transparent;color:var(--gold);border-color:var(--gold)}
.btn-outline:hover{background:var(--gold);color:#1a1405;box-shadow:0 10px 30px rgba(255,194,51,.3)}
.btn-small{padding:8px 22px;font-size:.9rem}
.btn-row{display:flex;gap:12px;flex-wrap:wrap}
.btn-wa{background:#25d366;color:#07240f}
.btn-wa:hover{box-shadow:0 10px 30px rgba(37,211,102,.4)}
a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* Nav */
.nav{position:fixed;inset:0 0 auto 0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:16px 5%;transition:.3s}
.nav::before{content:"";position:absolute;inset:0;z-index:-1;background:rgba(26,15,10,.93);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 5px 30px rgba(0,0,0,.4);opacity:0;transition:.3s}
.nav.scrolled::before{opacity:1}
.brand{display:flex;align-items:center;gap:12px;font-family:'Playfair Display',serif;font-size:1.45rem;font-weight:700;color:var(--gold)}
.brand-logo{height:44px;width:44px;object-fit:cover;border-radius:50%;background:#fff}
.links{display:flex;align-items:center;gap:26px}
.links a:not(.btn){font-size:.95rem;position:relative}
.links a:not(.btn)::after{content:"";position:absolute;inset-inline-start:0;bottom:-5px;width:0;height:2px;background:var(--gold);transition:.3s}
.links a:not(.btn):hover::after{width:100%}
.lang{display:flex;gap:4px;background:rgba(255,255,255,.08);border-radius:50px;padding:3px}
.lang button{background:none;border:0;color:var(--muted);font:600 .8rem 'Poppins',sans-serif;padding:5px 12px;border-radius:50px;cursor:pointer;transition:.2s}
.lang button.active{background:var(--gold);color:#1a1405}
.burger{display:none;background:none;border:0;cursor:pointer;flex-direction:column;gap:6px}
.burger span{width:26px;height:2px;background:var(--gold)}

/* Hero : photo en fond */
.hero{position:relative;min-height:100vh;display:flex;align-items:center;padding:120px 5% 100px;
  background:
    linear-gradient(100deg,rgba(26,15,10,.95) 15%,rgba(26,15,10,.7) 55%,rgba(26,15,10,.5)),
    radial-gradient(circle at 82% 35%,rgba(232,64,42,.3),transparent 55%),
    url(images/g2.jpg) center/cover no-repeat,var(--bg)}
[dir=rtl] .hero{background:
    linear-gradient(260deg,rgba(26,15,10,.95) 15%,rgba(26,15,10,.7) 55%,rgba(26,15,10,.5)),
    radial-gradient(circle at 18% 35%,rgba(232,64,42,.3),transparent 55%),
    url(images/g2.jpg) center/cover no-repeat,var(--bg)}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:120px;background:linear-gradient(transparent,var(--bg))}
.hero-inner{position:relative;z-index:1;width:min(1100px,100%);margin:auto;display:grid;grid-template-columns:1.1fr .9fr;gap:50px;align-items:center}
.hero-content h1{font-size:clamp(3.4rem,9vw,6.6rem);font-weight:900;line-height:1;background:linear-gradient(135deg,#fff,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-content h1 span{display:block;margin-top:16px;font-family:'Poppins',sans-serif;font-size:clamp(.95rem,2.3vw,1.4rem);font-weight:600;letter-spacing:.5em;text-transform:uppercase;-webkit-text-fill-color:var(--gold);color:var(--gold)}
html[lang=ar] .hero-content h1 span{font-family:'Cairo',sans-serif;letter-spacing:.1em}
.tagline{max-width:500px;margin:24px 0 34px;color:#ecd9c4;font-size:1.12rem}
.hero-btns{display:flex;gap:14px;flex-wrap:wrap}
.hero-logo{position:relative;justify-self:center;width:min(380px,74vw);aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:0 0 90px 16px rgba(232,64,42,.4);animation:float 7s ease-in-out infinite}
.hero-logo::before{content:"";position:absolute;inset:-16px;border:2px dashed rgba(255,194,51,.6);border-radius:50%;animation:spin 30s linear infinite}
.hero-logo img{width:100%;height:100%;object-fit:contain;padding:6%;border-radius:50%}
@keyframes float{50%{transform:translateY(-16px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.open-badge{display:inline-flex;align-items:center;gap:8px;margin-bottom:18px;padding:6px 16px;border-radius:50px;font-size:.82rem;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14)}
.open-badge[hidden]{display:none}
.open-badge i{width:9px;height:9px;border-radius:50%;background:#aaa}
.open-badge.open i{background:#2ecc71;box-shadow:0 0 0 4px rgba(46,204,113,.25)}
.open-badge.closed i{background:var(--red);box-shadow:0 0 0 4px rgba(232,64,42,.25)}

/* Bandeau défilant */
.marquee{direction:ltr;overflow:hidden;background:var(--red);padding:14px 0;transform:rotate(-1deg);margin:-30px -10px 0;position:relative;z-index:2;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.marquee-track{display:flex;gap:46px;width:max-content;animation:scroll 28s linear infinite;font-weight:700;font-size:1.1rem;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
@keyframes scroll{to{transform:translateX(-50%)}}

/* Avantages */
.features{padding:90px 0 0}
.feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.feat{background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:var(--radius);padding:30px 26px;text-align:center;transition:.3s}
.feat:hover{transform:translateY(-6px);border-color:rgba(255,194,51,.5)}
.feat .ico{font-size:2.2rem;width:74px;height:74px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,rgba(232,64,42,.3),rgba(255,194,51,.15));border:1px solid rgba(255,194,51,.4)}
.feat h3{font-size:1.25rem;margin-bottom:6px}
.feat p{color:var(--muted);font-size:.92rem}

/* Menu */
.menu{background:var(--bg2);background-image:radial-gradient(rgba(255,194,51,.07) 1px,transparent 1px);background-size:26px 26px}
.tabs{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:46px}
.tab{background:var(--card);border:1px solid rgba(255,255,255,.12);color:var(--text);padding:12px 26px;border-radius:50px;cursor:pointer;font:500 .98rem 'Poppins',sans-serif;transition:.3s}
html[lang=ar] .tab{font-family:'Cairo',sans-serif}
.tab:hover{border-color:var(--gold);color:var(--gold)}
.tab.active{background:linear-gradient(135deg,var(--red),#ff7a45);border-color:transparent;color:#fff;box-shadow:0 8px 24px rgba(232,64,42,.4)}
.panel{display:none;animation:fade .5s}
.panel.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:26px;align-items:start}
.group{background:linear-gradient(160deg,#3a251b,#2a1a12);border-radius:var(--radius);border:1px solid rgba(255,255,255,.08);overflow:hidden;transition:.3s;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.group:hover{transform:translateY(-5px);border-color:rgba(255,194,51,.5)}
.g-head{display:flex;align-items:center;gap:14px;padding:20px 24px;background:linear-gradient(135deg,rgba(232,64,42,.4),rgba(255,194,51,.12));border-bottom:2px solid var(--gold)}
.g-ico{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:1.7rem;background:var(--bg);border:1px solid rgba(255,194,51,.5);flex-shrink:0}
.g-head h3{font-size:1.5rem;color:#fff}
.g-head small{display:block;font-family:'Poppins',sans-serif;font-size:.76rem;color:var(--gold2);font-weight:400}
html[lang=ar] .g-head small{font-family:'Cairo',sans-serif}
.g-list{padding:8px 24px 12px}
.row{display:flex;align-items:center;gap:10px;padding:11px 8px;margin:0 -8px;border-radius:10px;transition:.2s}
.row:hover{background:rgba(255,194,51,.08)}
.row .name{font-weight:500}
.dots{flex:1;border-bottom:2px dotted rgba(255,194,51,.3);transform:translateY(3px)}
.p{background:rgba(255,194,51,.16);color:var(--gold2);padding:3px 13px;border-radius:50px;font-weight:600;font-size:.92rem;min-width:52px;text-align:center;white-space:nowrap}
.row.star .name{color:var(--gold);font-weight:600}
.row.star .name::after{content:" ★"}
.row.star .p{background:var(--red);color:#fff}
.row.head{padding:2px 8px 0}.row.head:hover{background:none}
.row.head .p{background:none;color:var(--muted);font-size:.8rem}
.note{text-align:center;color:var(--muted);font-size:.85rem;margin-top:34px}

/* À propos */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}
.about-img{position:relative;border-radius:var(--radius);aspect-ratio:4/3;background:var(--card);box-shadow:0 25px 60px rgba(0,0,0,.5)}
.about-img::before{content:"";position:absolute;inset:18px -18px -18px 18px;border:2px solid var(--gold);border-radius:var(--radius);z-index:-1}
[dir=rtl] .about-img::before{inset:18px 18px -18px -18px}
.about-img img{width:100%;height:100%;object-fit:cover;border-radius:var(--radius)}
.about h2{font-size:clamp(1.9rem,4vw,2.8rem);margin-bottom:16px}
.about p{color:var(--muted);margin-bottom:26px}

/* Galerie */
.gallery-grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:230px;gap:14px}
.g-item{border-radius:var(--radius);overflow:hidden;background:var(--card);position:relative}
.g-item.big{grid-column:span 2;grid-row:span 2}
.g-item img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.g-item::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(26,15,10,.6));opacity:0;transition:.3s}
.g-item:hover img{transform:scale(1.1)}
.g-item:hover::after{opacity:1}

/* Bannière appel */
.cta{margin:0;padding:90px 5%;text-align:center;background:linear-gradient(rgba(26,15,10,.78),rgba(26,15,10,.82)),url(images/g4.jpg) center/cover fixed,var(--bg2)}
.cta h2{font-size:clamp(2rem,5vw,3.4rem);margin-bottom:12px}
.cta p{color:#ecd9c4;margin-bottom:28px}
.cta .btn-row{justify-content:center}

/* Horaires + contact */
.contact{background:var(--bg2)}
.contact h2{font-size:clamp(1.9rem,4vw,2.8rem);margin-bottom:24px}
.info{margin-bottom:28px;display:grid;gap:18px}
.info li{display:flex;gap:14px;align-items:flex-start}
.info li>span{font-size:1.3rem;background:var(--card);width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;border:1px solid rgba(255,194,51,.3)}
.info a{color:var(--gold)}
.hours{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius);padding:8px 22px;margin-bottom:26px}
.hours li{display:flex;justify-content:space-between;gap:14px;padding:9px 10px;margin:0 -10px;border-bottom:1px dashed rgba(255,255,255,.1);font-size:.95rem}
.hours li:last-child{border:0}
.hours li.today{background:rgba(255,194,51,.14);border-radius:10px;color:var(--gold2);font-weight:600;border-color:transparent}
.hours li.off span:last-child{color:var(--red)}
.hours span:last-child{direction:ltr}
.map{border-radius:var(--radius);overflow:hidden;min-height:520px;box-shadow:0 25px 60px rgba(0,0,0,.45)}
.map iframe{width:100%;height:100%;min-height:520px;border:0}

/* Hero animé */
.bg-food{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bg-food span{position:absolute;font-size:var(--s);opacity:.2;filter:blur(1.5px);animation:drift var(--t) ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes drift{50%{transform:translateY(-30px) rotate(14deg)}}
.hero-art{position:relative;justify-self:center;--d:min(380px,74vw);width:var(--d);aspect-ratio:1;animation:float 7s ease-in-out infinite}
.hero-art .hero-logo{width:100%;animation:none}
.orbit{position:absolute;inset:0;animation:spin 45s linear infinite}
.orbit .o{position:absolute;top:50%;left:50%;width:0;height:0;transform:rotate(var(--a)) translateX(calc(var(--d)/2 + 64px))}
.orbit .o i{position:absolute;display:grid;place-items:center;width:64px;height:64px;margin:-32px 0 0 -32px;font-style:normal;font-size:2.3rem;border-radius:50%;background:rgba(26,15,10,.72);border:1px solid rgba(255,194,51,.55);box-shadow:0 8px 24px rgba(0,0,0,.5);animation:unspin 45s linear infinite}
@keyframes unspin{from{transform:rotate(calc(-1*var(--a)))}to{transform:rotate(calc(-1*var(--a) - 360deg))}}
@media(prefers-reduced-motion:reduce){.orbit .o i{transform:rotate(calc(-1*var(--a)))}}

/* Sous-catégories du menu */
.groups{display:block;max-width:560px;margin:auto}
.subtabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:-16px auto 30px;max-width:780px}
.subtab{background:transparent;border:1px solid rgba(255,194,51,.4);color:var(--gold2);padding:8px 18px;border-radius:50px;font:500 .88rem 'Poppins',sans-serif;cursor:pointer;transition:.25s}
html[lang=ar] .subtab{font-family:'Cairo',sans-serif}
.subtab:hover{background:rgba(255,194,51,.15)}
.subtab.active{background:var(--gold);border-color:var(--gold);color:#1a1405;font-weight:600}
@media(max-width:860px){
  .hero-art{--d:min(230px,58vw);order:-1}
  .orbit .o{transform:rotate(var(--a)) translateX(calc(var(--d)/2 + 40px))}
  .orbit .o i{width:48px;height:48px;margin:-24px 0 0 -24px;font-size:1.7rem}
  .bg-food span{opacity:.14}
}

/* Logo libre (sans cercle) + 2e orbite + braises */
.hero-art{--d:min(300px,72vw)}
.hero-art::before{content:"";position:absolute;inset:-20%;border-radius:50%;background:radial-gradient(circle,rgba(232,64,42,.45),rgba(255,194,51,.12) 45%,transparent 70%);animation:pulse 5s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12);opacity:.75}}
.hero-art .hero-logo{position:absolute;inset:6%;width:auto;aspect-ratio:auto;background:#fff;border-radius:50%;overflow:hidden;border:4px solid var(--gold);box-shadow:0 0 60px 8px rgba(232,64,42,.45)}
.hero-art .hero-logo::before{display:none}
.hero-art .hero-logo img{width:100%;height:100%;padding:0;border-radius:50%;object-fit:cover;object-position:50% 60%;transform:scale(1.22);filter:none}
.orbit .o{transform:rotate(var(--a)) translateX(calc(var(--d)/2 + 46px))}
.orbit.two{animation:spin 70s linear infinite reverse}
.orbit.two .o{transform:rotate(var(--a)) translateX(calc(var(--d)/2 + 92px))}
.orbit.two .o i{width:46px;height:46px;margin:-23px 0 0 -23px;font-size:1.6rem;animation:unspin 70s linear infinite reverse;background:rgba(26,15,10,.55)}
.bg-food b{position:absolute;bottom:-12px;width:var(--w);height:var(--w);border-radius:50%;background:radial-gradient(circle,#ffe08a,rgba(255,194,51,0) 70%);animation:rise var(--t) linear infinite;animation-delay:var(--dl)}
@keyframes rise{0%{transform:translate(0,0);opacity:0}12%{opacity:.9}100%{transform:translate(var(--x),-105vh);opacity:0}}
@media(prefers-reduced-motion:reduce){.orbit.two .o i{transform:rotate(calc(-1*var(--a)))}}

/* Carte + lien */
.map-wrap{display:flex;flex-direction:column}
.map-wrap .map{min-height:440px;flex:1}
.map-wrap .map iframe{min-height:440px}
.map-link{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;padding:14px;border-radius:50px;background:var(--card);border:1px solid rgba(255,194,51,.45);color:var(--gold);font-weight:600;transition:.3s}
.map-link:hover{background:var(--gold);color:#1a1405}
.hours span:first-child{font-weight:500}
@media(max-width:860px){
  .hero-art{--d:min(210px,56vw)}
  .orbit .o{transform:rotate(var(--a)) translateX(calc(var(--d)/2 + 36px))}
  .orbit.two{display:none}
  .map-wrap .map,.map-wrap .map iframe{min-height:340px}
}

/* Carte décorée */
.map-wrap .map{position:relative;min-height:520px;border:2px solid rgba(255,194,51,.55);box-shadow:0 0 0 7px rgba(255,194,51,.08),0 25px 60px rgba(0,0,0,.5)}
.map-wrap .map iframe{min-height:520px}
.map-pin{position:absolute;top:14px;inset-inline-start:14px;z-index:2;background:rgba(26,15,10,.88);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,194,51,.5);border-radius:14px;padding:9px 16px;font-weight:600;font-size:.9rem;line-height:1.4;pointer-events:none}
.map-pin small{display:block;color:var(--muted);font-weight:400;font-size:.76rem}
@media(max-width:860px){.map-wrap .map,.map-wrap .map iframe{min-height:380px}}

/* Finitions */
.progress{position:fixed;top:0;inset-inline:0;height:3px;z-index:200;background:linear-gradient(90deg,var(--red),var(--gold));transform-origin:left;transform:scaleX(0)}
[dir=rtl] .progress{transform-origin:right}
.hero-content h1{background:linear-gradient(110deg,#fff 30%,var(--gold2) 45%,#fff 60%);background-size:250% auto;-webkit-background-clip:text;background-clip:text;animation:shine 7s linear infinite}
@keyframes shine{to{background-position:-250% center}}
.btn{position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;top:0;inset-inline-start:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);transition:.7s}
.btn:hover::after{inset-inline-start:140%}
.row.star .p{animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 5px rgba(232,64,42,.25)}}
.g-ico{transition:.4s;position:relative;overflow:hidden}
.g-ico img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.g-ico.has{width:84px;height:84px}
.group:hover .g-ico{transform:rotate(-12deg) scale(1.1)}
.head h2::after{content:"— ✦ —"}
.g-item{cursor:zoom-in}
.lb{position:fixed;inset:0;z-index:300;display:none;place-items:center;background:rgba(0,0,0,.88);padding:4vw;cursor:zoom-out}
.lb.open{display:grid;animation:fade .3s}
.lb img{max-height:88vh;max-width:92vw;border-radius:var(--radius);box-shadow:0 20px 80px rgba(0,0,0,.7)}

.footer{text-align:center;padding:30px 5%;color:var(--muted);font-size:.9rem;border-top:1px solid rgba(255,255,255,.07)}
.footer a{color:var(--gold)}

.reveal{opacity:0;transform:translateY(36px);transition:opacity .8s,transform .8s}
.reveal.show{opacity:1;transform:none}

.float-cta{display:none}
.fab svg{width:28px;height:28px;fill:#fff}
.fab{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.fab-wa{background:#25d366}.fab-call{background:var(--red)}

@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}.reveal{opacity:1;transform:none}.cta{background-attachment:scroll}}

@media(max-width:860px){
  .grid-2{grid-template-columns:1fr;gap:44px}
  .section{padding:72px 0}
  .feat-grid{grid-template-columns:1fr}
  .hero{padding-top:110px}
  .hero-inner{grid-template-columns:1fr;gap:40px;text-align:center}
  .hero-logo{order:-1;width:min(240px,62vw)}
  .tagline{margin-inline:auto}
  .hero-btns{justify-content:center}
  .gallery-grid{grid-template-columns:repeat(2,1fr);grid-auto-rows:170px}
  .g-item.big{grid-column:span 2;grid-row:span 2}
  .about-img::before{display:none}
  .cta{background-attachment:scroll}
  .map,.map iframe{min-height:360px}
  .burger{display:flex;z-index:101}
  .links{position:fixed;inset:0 0 0 30%;background:var(--bg);flex-direction:column;justify-content:center;gap:26px;transform:translateX(100%);transition:.35s;box-shadow:-20px 0 50px rgba(0,0,0,.6)}
  [dir=rtl] .links{inset:0 30% 0 0;transform:translateX(-100%);box-shadow:20px 0 50px rgba(0,0,0,.6)}
  .links.open{transform:none}
  .links:not(.open){visibility:hidden;transition:.35s,visibility 0s .35s}
  .links a:not(.btn){font-size:1.2rem}
  .float-cta{display:flex;flex-direction:column;gap:12px;position:fixed;inset-inline-end:16px;bottom:18px;z-index:90}
  .footer{padding-bottom:92px}
}

/* Commande */
.p.add{border:0;font-family:inherit;cursor:pointer;transition:.2s}
.p.add{display:inline-flex;align-items:center;gap:8px;padding-block:3px;padding-inline:12px 4px}
.p.add::after{content:"+";width:26px;height:26px;border-radius:50%;background:var(--gold);color:#1a1405;display:grid;place-items:center;font-size:1.15rem;font-weight:700;line-height:1}
.p.add:hover{background:var(--gold);color:#1a1405;transform:scale(1.07)}
.row.star .p.add:hover{background:var(--gold);color:#1a1405}
.cartbar{position:fixed;inset-inline:12px;bottom:14px;z-index:95;margin-inline:auto;max-width:520px;display:none;align-items:center;justify-content:space-between;gap:12px;padding:13px 22px;border:0;border-radius:50px;background:linear-gradient(135deg,var(--red),#ff7a45);color:#fff;font:600 .95rem 'Poppins',sans-serif;cursor:pointer;box-shadow:0 10px 34px rgba(0,0,0,.55)}
html[lang=ar] .cartbar{font-family:'Cairo',sans-serif}
.cartbar.show{display:flex}
.cartbar.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.04)}}
body.has-cart .float-cta{bottom:84px}
.ord{position:fixed;inset:0;z-index:250;display:none;place-items:center;background:rgba(0,0,0,.8);padding:14px}
.ord.open{display:grid}
.ord-box{position:relative;width:min(480px,100%);max-height:92vh;overflow:auto;background:var(--bg2);border:1px solid rgba(255,194,51,.4);border-radius:var(--radius);padding:26px 22px}
.ord-x{position:absolute;top:10px;inset-inline-end:12px;background:none;border:0;color:var(--muted);font-size:1.3rem;cursor:pointer}
.ord-box h3{font-size:1.6rem;margin-bottom:14px;color:var(--gold)}
.ord-list li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.12)}
.ol-n{flex:1;font-size:.92rem;line-height:1.35}
.ol-q{display:flex;align-items:center;gap:8px}
.ol-q button{width:36px;height:36px;border-radius:50%;border:1px solid var(--gold);background:none;color:var(--gold);font-size:1rem;line-height:1;cursor:pointer}
.ol-p{min-width:58px;text-align:end;font-weight:600;color:var(--gold2);white-space:nowrap}
.ord-total{display:flex;justify-content:space-between;align-items:center;margin:14px 0 4px;font-size:1.15rem}
.ord-total b{color:var(--gold)}
.ord-clear{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;font-size:.82rem;margin-bottom:10px}
.ord label{display:block;margin-top:12px;font-size:.85rem;color:var(--muted)}
.ord input,.ord textarea{width:100%;margin-top:4px;padding:11px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:var(--bg);color:var(--text);font:inherit}
.ord input:focus,.ord textarea:focus{outline:2px solid var(--gold);border-color:transparent}
.ord-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph{display:flex;direction:ltr;margin-top:4px;border:1px solid rgba(255,255,255,.18);border-radius:12px;background:var(--bg);overflow:hidden}
.ph:focus-within{outline:2px solid var(--gold)}
.ph .cc{display:flex;align-items:center;gap:6px;padding:0 12px;background:rgba(255,194,51,.12);color:var(--gold2);font-weight:600;white-space:nowrap;border-inline-end:1px solid rgba(255,255,255,.14)}
.ord .ph input{margin:0;border:0;border-radius:0;flex:1;min-width:0;letter-spacing:.04em}
.ord .ph input:focus{outline:0}
.ord-err{color:#ff8a7a;font-size:.88rem;min-height:1.3em;margin-top:10px}
.ord-hint{color:var(--muted);font-size:.8rem;margin-top:10px;text-align:center}
.ord .btn{width:100%;margin-top:14px;text-align:center}
.ord-loc{font-size:.82rem;color:var(--muted);margin-top:10px}
.ord-mode{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.ord .ord-mode .opt{margin:0;display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid rgba(255,255,255,.18);border-radius:12px;cursor:pointer;color:var(--text);font-size:.88rem;line-height:1.3}
.ord .ord-mode .opt input{width:auto;margin:0;accent-color:var(--gold)}
.ord .ord-mode .opt:has(input:checked){border-color:var(--gold);background:rgba(255,194,51,.1)}
.ord-fee{color:var(--gold2);font-size:.85rem;text-align:end}
.howto{margin:14px auto 0;max-width:600px;padding:10px 16px;border:1px dashed rgba(255,194,51,.55);border-radius:14px;color:var(--gold2);font-size:.92rem;line-height:1.6}
.ord-step{margin:18px 0 0;font:600 .95rem 'Poppins',sans-serif;color:var(--gold)}
html[lang=ar] .ord-step{font-family:'Cairo',sans-serif}
.toast{position:fixed;inset-inline:0;bottom:92px;margin-inline:auto;width:max-content;max-width:90vw;z-index:96;background:#1f7a3d;color:#fff;padding:8px 18px;border-radius:50px;font-size:.88rem;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.no-order .cartbar,.no-order .ord,.no-order .toast,.no-order .howto{display:none!important}
.ic{width:1.15em;height:1.15em;fill:currentColor;vertical-align:-.2em;margin-inline-end:.4em}
.ic.ig{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.info li>span .ic{width:22px;height:22px;margin:0;fill:var(--gold)}
.map-pin .ic,.map-link .ic{margin-inline-end:.3em}
body .float-cta{inset-inline-end:2px;gap:10px}
body .fab{width:38px;height:38px}
body .fab svg{width:20px;height:20px}
.info li>span.pic{padding:0;overflow:hidden}
.info li>span.pic img{width:100%;height:100%;object-fit:contain}
.info li>span.pic-tel{background:none;border:0}
.info li>span.pic-pin img{width:62%;height:62%}
.tI{width:26px;height:26px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-inline-end:8px}
.tI.sI{width:20px;height:20px;margin-inline-end:6px}
.orbit .o i{overflow:hidden}
.orbit .o i img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.tab,.subtab{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
.g-list.multi .p{min-width:92px}
.g-list.multi .p.add{justify-content:space-between}
.g-list.multi .row.head .p{text-align:start;padding-inline:14px;font-weight:700;color:var(--gold);font-size:.85rem}
.cart-btn{position:relative;display:grid;place-items:center;width:44px;height:44px;margin-inline-start:18px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,194,51,.5);color:var(--gold);cursor:pointer}
.cart-btn .ic{width:22px;height:22px;margin:0}
.cart-btn .cnt{position:absolute;top:-6px;inset-inline-end:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:50px;background:var(--red);color:#fff;font:700 .72rem 'Poppins',sans-serif;display:grid;place-items:center}
.cart-btn .cnt:empty{display:none}
@media(max-width:860px){.cart-btn{margin-inline:auto 14px}}
.ord-empty{display:none;text-align:center;color:var(--muted);padding:22px 8px}
.ord.empty .ord-empty{display:block}
.ord.empty #ordForm,.ord.empty .ord-total,.ord.empty .ord-fee,.ord.empty .ord-clear{display:none}
.btn.btn-ico{width:56px;height:56px;padding:0;display:inline-grid;place-items:center;border-radius:50%}
.btn.btn-ico .ic{width:26px;height:26px;margin:0}
.btn-row:has(.btn-ico){display:flex;gap:14px;flex-wrap:wrap}
.f-ico{display:inline-grid;place-items:center;width:34px;height:34px;margin-inline-start:10px;vertical-align:middle;border-radius:50%;border:1px solid rgba(255,194,51,.5);color:var(--gold)}
.f-ico .ic{width:17px;height:17px;margin:0}
/* Brand colors for Instagram / Facebook so they stand out from the background */
a[aria-label="Instagram"].btn-ico,a[aria-label="Instagram"].f-ico{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%);border:2px solid #fff;color:#fff}
a[aria-label="Facebook"].btn-ico,a[aria-label="Facebook"].f-ico{background:#1877f2;border:2px solid #fff;color:#fff}
a[aria-label="Instagram"].btn-ico:hover,a[aria-label="Facebook"].btn-ico:hover,a[aria-label="Instagram"].f-ico:hover,a[aria-label="Facebook"].f-ico:hover{color:#fff;transform:translateY(-3px) scale(1.06);box-shadow:0 8px 22px rgba(0,0,0,.5)}
a[aria-label="Instagram"].btn-ico:hover{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%)}
a[aria-label="Facebook"].btn-ico:hover{background:#1877f2}
</style>

function renderGroup(g) {
  const multi = Array.isArray(g.cols);
  let rows = multi ? `<li class="row head"><span class="name"></span><i class="dots" style="border:0"></i>${g.cols.map(c => `<span class="p">${c}</span>`).join('')}</li>` : '';
  g.items.forEach(it => {
    const dt = TEXT[lang].dt;
    const prices = it.slice(1).map((p, i) => ORDERING
      ? `<button type="button" class="p add" data-g="${g.t}" data-n="${it[0]}" data-s="${multi ? g.cols[i] : ''}" data-p="${p}">${p} ${dt}</button>`
      : `<span class="p">${p} ${dt}</span>`).join('');
    const star = /^(mon pote|box big pote)/i.test(it[0]) ? ' star' : '';
    rows += `<li class="row${star}"><span class="name">${tr(it[0])}</span><i class="dots"></i>${prices}</li>`;
  });
  return `<article class="group"><div class="g-head"><span class="g-ico${PHOTOS[slug(g.t)] ? ' has' : ''}">${PHOTOS[slug(g.t)] ? `<img src="${PHOTOS[slug(g.t)]}" alt="">` : g.i}</span><h3>${tr(g.t)}${g.sub ? `<small>${tr(g.sub)}</small>` : ''}</h3></div><ul class="g-list${multi ? ' multi' : ''}">${rows}</ul></article>`;
}

let activeSub = {};
function renderMenu() {
  tabsEl.innerHTML = MENU.map(c => `<button class="tab${c.id === activeTab ? ' active' : ''}" data-tab="${c.id}">${tabImg(c.id)}${tr(c.label)}</button>`).join('');
  panelsEl.innerHTML = MENU.map(c => {
    const si = Math.min(activeSub[c.id] || 0, c.groups.length - 1);
    const subs = c.groups.length > 1
      ? `<div class="subtabs">${c.groups.map((g, i) => `<button class="subtab${i === si ? ' active' : ''}" data-cat="${c.id}" data-sub="${i}">${grpImg(g.t)}${tr(g.t)}</button>`).join('')}</div>`
      : '';
    return `<div class="panel${c.id === activeTab ? ' active' : ''}" id="${c.id}">${subs}<div class="groups">${renderGroup(c.groups[si])}</div></div>`;
  }).join('');
}

tabsEl.addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  activeTab = tab.dataset.tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tab));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === activeTab));
});
panelsEl.addEventListener('click', e => {
  const a = e.target.closest('.add');
  if (a) { addToCart(a.dataset.g, a.dataset.n, a.dataset.s, +a.dataset.p); return; }
  const b = e.target.closest('.subtab');
  if (!b) return;
  activeSub[b.dataset.cat] = +b.dataset.sub;
  renderMenu();
});

/* ---------- Horaires + badge Ouvert/Fermé (heure de Tunis) ---------- */
const toMin = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
const closeMin = s => { const v = toMin(s); return v === 0 ? 1440 : v; };
function tunisNow() {
  const p = {};
  new Intl.DateTimeFormat('en-US', { timeZone: 'Africa/Tunis', weekday: 'short', hour: 'numeric', minute: 'numeric', hour12: false })
    .formatToParts(new Date()).forEach(x => p[x.type] = x.value);
  return { day: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(p.weekday), min: (parseInt(p.hour, 10) % 24) * 60 + parseInt(p.minute, 10) };
}
const fmt = s => s === '00:00' ? '00:00' : s;

function renderHours() {
  const t = TEXT[lang], now = tunisNow();
  const order = [1, 2, 3, 4, 5, 6, 0], runs = [];
  order.forEach(d => {
    const key = HOURS[d] ? HOURS[d].join('-') : 'off';
    const last = runs[runs.length - 1];
    if (last && last.key === key) last.days.push(d); else runs.push({ key, days: [d] });
  });
  document.getElementById('hours').innerHTML = runs.map(r => {
    const a = DAYS[lang][r.days[0]], b = DAYS[lang][r.days[r.days.length - 1]], h = HOURS[r.days[0]];
    const label = runs.length === 1 ? t.everyday : (r.days.length === 1 ? a : `${a} – ${b}`);
    return `<li class="${h ? '' : 'off'}"><span>${label}</span><span>${h ? h[0] + ' – ' + h[1] : t.off}</span></li>`;
  }).join('');

  const badge = document.getElementById('openBadge'), h = HOURS[now.day];
  const open = h && now.min >= toMin(h[0]) && now.min < closeMin(h[1]);
  badge.className = 'open-badge ' + (open ? 'open' : 'closed');
  let txt = open ? `${t.open} · ${t.until} ${h[1] === '00:00' ? t.midnight : h[1]}` : t.closed;
  if (!open) {
    const nextDay = h && now.min < toMin(h[0]) ? now.day : [1, 2, 3, 4, 5, 6, 7].map(k => (now.day + k) % 7).find(d => HOURS[d]);
    if (nextDay !== undefined && HOURS[nextDay]) {
      const when = nextDay === now.day ? t.opens_at : ((nextDay - now.day + 7) % 7 === 1 ? t.tomorrow : DAYS[lang][nextDay] + ' ' + t.opens_at);
      txt += ` · ${when} ${HOURS[nextDay][0]}`;
    }
  }
  badge.querySelector('span').textContent = txt;
  badge.hidden = false;
}

/* ---------- Changement de langue ---------- */
function setLang(l) {
  lang = l;
  try { localStorage.setItem('lang', l); } catch (e) {}
  document.documentElement.lang = l;
  document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = TEXT[l][el.dataset.i18n]; });
  document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('active', b.dataset.lang === l));
  renderMenu();
  renderHours();
  renderCart();
  document.querySelectorAll('[data-wa]').forEach(a => { a.href = 'https://wa.me/21692289602?text=' + encodeURIComponent(TEXT[l].wa_msg); });
}
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));

/* ---------- Panier / commande (envoyée par WhatsApp) ---------- */
const WA = '21692289602';
let cart = [];
const money = n => String(+n.toFixed(2));
const cartCount = () => cart.reduce((a, c) => a + c.q, 0);
const cartTotal = () => cart.reduce((a, c) => a + c.q * c.p, 0);
const lineFr = c => `${c.g} – ${c.n}${c.s ? ' (' + c.s + ')' : ''}`;
const lineTr = c => `${tr(c.g)} – ${tr(c.n)}${c.s ? ' (' + c.s + ')' : ''}`;
const cartbar = document.getElementById('cartbar');
const ordEl = document.getElementById('ord');
const ordList = document.getElementById('ordList');

function addToCart(g, n, s, p) {
  const f = cart.find(c => c.g === g && c.n === n && c.s === s);
  if (f) f.q++; else cart.push({ g, n, s, p, q: 1 });
  renderCart();
  cartbar.classList.remove('bump'); void cartbar.offsetWidth; cartbar.classList.add('bump');
  const tt = document.getElementById('toast');
  tt.textContent = '✓ ' + lineTr({ g, n, s });
  tt.classList.add('show');
  clearTimeout(addToCart.t); addToCart.t = setTimeout(() => tt.classList.remove('show'), 1600);
}
function renderCart() {
  const t = TEXT[lang], n = cartCount();
  document.body.classList.toggle('has-cart', n > 0);
  cartbar.classList.toggle('show', n > 0);
  cartbar.innerHTML = `<span>🛒 ${n} ${t.items} · ${money(cartTotal())} ${t.dt}</span><span>${t.view_order} ›</span>`;
  ordList.innerHTML = cart.map((c, i) => `<li><span class="ol-n">${lineTr(c)}</span><span class="ol-q"><button type="button" data-i="${i}" data-d="-1" aria-label="-">−</button><b>${c.q}</b><button type="button" data-i="${i}" data-d="1" aria-label="+">+</button></span><span class="ol-p">${money(c.p * c.q)} ${t.dt}</span></li>`).join('');
  document.getElementById('ordTotal').textContent = money(cartTotal() + fee()) + ' ' + t.dt;

const TITLE=document.title;
let tab='o',filter='act',q='',user=null,orders=[],unsub=null,snd=false,first=true,M=[],H=[],dirty=false,openC=new Set([0]),wl=null,cnt={};
const aud=new Audio(RING);aud.preload='auto';
const ring=()=>{if(!snd)return;try{aud.currentTime=0;const p=aud.play();p&&p.catch(()=>{})}catch(e){}};

const A=document.createElement('div');A.id='adm';A.hidden=true;
A.innerHTML=`<header class="top"><div class="bd2"><img src="images/logo.png" alt="" onerror="this.style.display='none'"><div><b>Mon Pote</b><small><i class="live"></i><span id="aSub"></span></small></div></div>
<div class="tools"><div class="lgsw" id="aLg"><button data-lg="fr" type="button">FR</button><button data-lg="ar" type="button">عربي</button><button data-lg="en" type="button">EN</button></div><button id="aS" class="tb snd-off" type="button"></button><button id="aO" class="tb" type="button" hidden></button><button id="aX" class="tb" type="button">✕</button></div></header>
<main id="aB"></main><nav id="aN" hidden></nav><div id="aT" class="at-toast" role="status"></div>`;
document.body.append(A);
const paintHead=()=>{A.dir=lg==='ar'?'rtl':'ltr';A.lang=lg;$('#aSub').textContent=tr('sub');$('#aO').innerHTML='⎋ <span class="lbl">'+tr('quit')+'</span>';$('#aX').setAttribute('aria-label',tr('close'));A.querySelectorAll('[data-lg]').forEach(b=>b.classList.toggle('on',b.dataset.lg===lg));paintSnd()};

const say=m=>{const t=$('#aT');t.textContent=m;t.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>t.classList.remove('show'),2400)};
const ms=o=>o.createdAt?.toMillis?o.createdAt.toMillis():Date.now();
const dayKey=t=>new Date(t).toLocaleDateString('fr-CA',{timeZone:TZ});
const fullDt=t=>new Date(t).toLocaleString(LOC[lg],{timeZone:TZ,day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const ago=t=>{const m=Math.max(0,Math.round((Date.now()-t)/60000));return m<1?tr('now'):m<60?tr('agoMin',m):m<1440?tr('agoH',Math.floor(m/60),String(m%60).padStart(2,'0')):fullDt(t)};
const r2=n=>Math.round((Number(n)||0)*100)/100;
const money=n=>String(r2(n)).replace('.',',')+' DT';
const d8=p=>String(p||'').replace(/\D/g,'').slice(-8);
const key=o=>d8(o.phone)||`${o.first||''} ${o.last||''}`.trim().toLowerCase();
const tally=()=>{cnt={};orders.forEach(o=>{const k=key(o);cnt[k]=(cnt[k]||0)+1})};
const nbArt=o=>(o.items||[]).reduce((a,i)=>a+(Number(i.q)||0),0);
const newCount=()=>orders.filter(o=>(o.status||'new')==='new').length;

/* ---- son + titre + écran allumé ---- */
const paintSnd=()=>{const b=$('#aS');b.className='tb '+(snd?'snd-on':'snd-off');b.innerHTML=(snd?'🔔':'🔕')+' <span class="lbl">'+(snd?tr('sndOn'):tr('snd'))+'</span>'};
const badge=()=>{const n=newCount();document.title=user&&n&&!A.hidden?`(${n}) ${tr('newOrd')} · Mon Pote`:TITLE};
const keepAwake=async()=>{try{if(snd&&navigator.wakeLock&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}catch(e){}};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')keepAwake()});
const toggleSnd=()=>{snd=!snd;paintSnd();if(snd){ring();keepAwake();say(tr('sndOnMsg'))}else{try{aud.pause()}catch(e){}say(tr('sndOffMsg'))}if(tab==='o')show()};
setInterval(()=>{if(snd&&user&&!A.hidden&&newCount())ring()},12000);
setInterval(()=>{if(user&&!A.hidden&&tab==='o'&&$('#oL'))paintO()},30000);

/* ---- statistiques ---- */
const stats=()=>{const k=dayKey(Date.now()),td=orders.filter(o=>dayKey(ms(o))===k),rev=td.reduce((a,o)=>a+(Number(o.total)||0),0);return{n:td.length,rev,avg:td.length?rev/td.length:0,nw:newCount(),pr:orders.filter(o=>o.status==='prep').length}};
const last7=()=>{const out=[];for(let i=6;i>=0;i--){const t=Date.now()-i*864e5,k=dayKey(t),os=orders.filter(o=>dayKey(ms(o))===k);out.push({k,l:new Date(t).toLocaleDateString(LOC[lg],{timeZone:TZ,weekday:'short'}),rev:os.reduce((a,o)=>a+(Number(o.total)||0),0),n:os.length})}return out};
const topDishes=()=>{const m={};orders.forEach(o=>(o.items||[]).forEach(i=>{m[i.n]=(m[i.n]||0)+(Number(i.q)||0)}));return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,8)};
const chart=()=>{const D=last7(),mx=Math.max(1,...D.map(d=>d.rev)),W=700,Hh=210,bw=56,gap=(W-bw*7)/8;
return `<svg class="bars" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="7 days">`+D.map((d,i)=>{const h=Math.max(d.rev?6:2,(Hh-60)*d.rev/mx),x=gap+i*(bw+gap),y=Hh-28-h;return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="9" fill="${i===6?'#ffc233':'#e8402a'}" opacity="${d.rev?1:.25}"/><text x="${x+bw/2}" y="${y-7}" text-anchor="middle" fill="#fff4e2" font-size="14" font-weight="600">${d.rev?Math.round(d.rev):''}</text><text x="${x+bw/2}" y="${Hh-8}" text-anchor="middle" fill="#cdb9a5" font-size="14">${esc(d.l)}</text>`}).join('')+'</svg>'};

/* ---- commandes ---- */
const FILT=()=>[['act',tr('fAct')],['new',tr('kNew')],['prep',tr('kPrep')],['done',tr('fDone')],['all',tr('fAll')]];
const inF=(o,f)=>{const s=o.status||'new';return f==='all'||(f==='act'?s!=='done':s===f)};
const card=o=>{const t=ms(o),st=o.status||'new',late=st==='new'&&Date.now()-t>5*60000,n=cnt[key(o)]||1,p=d8(o.phone);
const loc=String(o.loc||'').startsWith('https://maps.google.com/')?o.loc:'';
const nx=st==='new'?['prep',tr('accept'),'go']:st==='prep'?['done',tr('finish'),'ok']:['new',tr('reopen'),''];
return `<article class="oc s-${st}${late?' late':''}"><header><div><span class="num" dir="ltr">#${esc(String(o.id).slice(-4).toUpperCase())}</span><span class="pill ${o.mode==='delivery'?'dl':''}">${o.mode==='delivery'?tr('delivery'):tr('pickup')}</span></div><span class="tm" title="${fullDt(t)}">${late?'⏰ ':''}${ago(t)}</span></header>
<h3>${esc(o.first)} ${esc(o.last)} <small>${n>2?`<span class="pill vip">${tr('ordersN',n)}</span>`:n>1?tr('nth',n):tr('newClient')}</small></h3>
<div class="ct"><a href="tel:${esc(o.phone)}">📞 ${esc(o.phone)}</a>${p.length===8?`<a class="wa" href="https://wa.me/216${p}" target="_blank" rel="noopener">WhatsApp</a>`:''}${loc?`<a class="mp" href="${esc(loc)}" target="_blank" rel="noopener">${tr('pos')}</a>`:''}</div>
${o.addr?`<div class="nt">📍 ${esc(o.addr)}</div>`:''}
<ul class="its">${(o.items||[]).map(i=>`<li><b>${esc(i.q)}×</b> ${esc(i.n)}</li>`).join('')}</ul>
${o.note?`<div class="nt">📝 ${esc(o.note)}</div>`:''}
<div class="tt"><span>${nbArt(o)} ${tr('items')}${o.fee?` · ${tr('fee')} ${money(o.fee)}`:''}</span><b>${money(o.total)}</b></div>
<div class="ac2"><button class="bt ${nx[2]}" data-st="${nx[0]}" data-id="${o.id}">${nx[1]}</button><button class="bt ico" data-pr="${o.id}" title="${tr('print')}" aria-label="${tr('print')}">🖨</button><button class="bt ico" data-del="${o.id}" title="${tr('del')}" aria-label="${tr('del')}">🗑</button></div></article>`};
const paintO=()=>{if(!$('#oL'))return;const s=stats();
$('#oS').innerHTML=`<div class="kpi ${s.nw?'hot':''}"><span>${tr('kNew')}</span><b>${s.nw}</b></div><div class="kpi"><span>${tr('kPrep')}</span><b>${s.pr}</b></div><div class="kpi gold"><span>${tr('kToday')}</span><b>${money(s.rev)}</b></div><div class="kpi"><span>${s.n} ${tr('kAvg')}</span><b>${money(s.avg)}</b></div>`;
$('#oF').innerHTML=FILT().map(([k,l])=>`<button class="chip ${filter===k?'on':''}" data-f="${k}">${l}<i>${orders.filter(o=>inF(o,k)).length}</i></button>`).join('');
const w=q.trim().toLowerCase(),L=orders.filter(o=>inF(o,filter)&&(!w||`${o.first} ${o.last} ${o.phone} ${(o.items||[]).map(i=>i.n).join(' ')}`.toLowerCase().includes(w)));
$('#oL').innerHTML=L.length?L.map(card).join(''):`<div class="empty"><b>🍕</b>${tr('emptyO')}</div>`};

/* ---- clients ---- */
const clients=()=>{const m=new Map();orders.forEach(o=>{const k=key(o);let c=m.get(k);if(!c){c={name:`${o.first||''} ${o.last||''}`.trim()||tr('noname'),phone:o.phone||'',n:0,art:0,total:0,last:ms(o),os:[]};m.set(k,c)}c.n++;c.art+=nbArt(o);c.total+=Number(o.total)||0;c.os.push(o)});return[...m.values()].sort((a,b)=>b.n-a.n||b.total-a.total)};
const cList=w=>{w=(w||'').trim().toLowerCase();const L=clients().filter(c=>!w||c.name.toLowerCase().includes(w)||String(c.phone).replace(/\s/g,'').includes(w.replace(/\s/g,'')));
return `<div class="kpis" style="grid-template-columns:repeat(3,1fr)"><div class="kpi"><span>${tr('tClients')}</span><b>${L.length}</b></div><div class="kpi"><span>${tr('tOrders')}</span><b>${orders.length}</b></div><div class="kpi gold"><span>${tr('tTotal')}</span><b>${money(orders.reduce((a,o)=>a+(Number(o.total)||0),0))}</b></div></div><div class="grid">`+(L.length?L.map(c=>`<div class="cl-c"><div class="cl-h"><div class="av">${esc((c.name[0]||'?').toUpperCase())}</div><div><b>${esc(c.name)}${c.n>2?' ⭐':''}</b><a href="tel:${esc(c.phone)}" style="color:var(--gold);direction:ltr;display:inline-block">${esc(c.phone)}</a></div></div><div class="cst"><span>${tr('ordS',c.n)}</span><span>${tr('artS',c.art)}</span><span>💰 ${money(c.total)}</span><span>🕒 ${esc(ago(c.last))}</span></div><details><summary>${tr('see')}</summary>${c.os.map(o=>`<div class="co"><b style="color:var(--text)">${esc(fullDt(ms(o)))}</b> · ${money(o.total)}<br>${(o.items||[]).map(i=>`${esc(i.q)} × ${esc(i.n)}`).join('<br>')}</div>`).join('')}</details></div>`).join(''):`<div class="empty">${tr('noCl')}</div>`)+'</div>'};
const cHtml=()=>`<input id="cQ" class="sq" type="search" placeholder="${tr('csearch')}"><div id="cL">`+cList('')+'</div>';

/* ---- stats ---- */
const sHtml=()=>{const D=last7(),tot=D.reduce((a,d)=>a+d.rev,0),T=topDishes(),mx=T.length?T[0][1]:1;
return `<div class="kpis"><div class="kpi gold"><span>${tr('s7')}</span><b>${money(tot)}</b></div><div class="kpi"><span>${tr('s7n')}</span><b>${D.reduce((a,d)=>a+d.n,0)}</b></div><div class="kpi"><span>${tr('sTot')}</span><b>${orders.length}</b></div><div class="kpi"><span>${tr('basket')}</span><b>${money(orders.length?orders.reduce((a,o)=>a+(Number(o.total)||0),0)/orders.length:0)}</b></div></div>
<div class="two"><div class="sec"><h4>${tr('chartT')}</h4>${chart()}</div><div class="sec"><h4>${tr('topT')}</h4>${T.length?T.map(([n,c])=>`<div class="tp"><span>${esc(n)}</span><b>${c}</b><i><u style="width:${Math.round(100*c/mx)}%"></u></i></div>`).join(''):`<p style="color:var(--muted)">${tr('nodata')}</p>`}</div></div>`};

/* ---- menu ---- */
const mHtml=()=>M.map((c,ci)=>{const o=openC.has(ci);return `<div class="sec cat"><button class="ch" data-cat="${ci}" type="button"><span>${c.icon} ${esc(c.label)}</span><span>${o?'▾':(lg==='ar'?'◂':'▸')}</span></button>${o?`<div class="bdy">${c.groups.map((g,gi)=>`<u>${esc(g.t)}${g.cols?' ('+g.cols.join(' / ')+')':''}</u>${g.items.map((it,ii)=>`<div class="ar"><input class="ip" data-k="${ci}.${gi}.${ii}.0" value="${esc(it[0])}" aria-label="${tr('dishName')}">${it.slice(1).map((p,pi)=>`<label class="pr">${g.cols?esc(g.cols[pi]):'DT'}<input type="number" step="0.5" inputmode="decimal" data-k="${ci}.${gi}.${ii}.${pi+1}" value="${p}"></label>`).join('')}<button class="sm rm" data-rm="${ci}.${gi}.${ii}" type="button" aria-label="Retirer">✕</button></div>`).join('')}<button class="sm" data-add="${ci}.${gi}" type="button">${tr('addDish')}</button>`).join('')}</div>`:''}</div>`}).join('')+`<div class="sv ${dirty?'dirty':''}" id="mBar"><span id="mTxt">${dirty?tr('unsaved'):tr('allSaved')}</span><button class="bt" id="mS" type="button">${tr('saveMenu')}</button></div>`;

/* ---- horaires ---- */
const hHtml=()=>`<div class="sec">${H.map((h,i)=>`<div class="hr"><span class="d">${(DAYS[lg]||DAYS.fr)[i]}</span><label class="sw"><input type="checkbox" data-hd="${i}" ${h?'checked':''} aria-label="${tr('open')}"><i></i></label>${h?`<input class="ip" type="time" data-ho="${i}" value="${h[0]}"><span>→</span><input class="ip" type="time" data-hc="${i}" value="${h[1]}">`:`<span class="cl">${tr('closed')}</span>`}</div>`).join('')}<div class="ac2" style="margin-top:14px"><button class="bt" id="hAll" type="button">${tr('copyAll')}</button><button class="bt go" id="hS" type="button" style="background:var(--gold);color:#1a1405">${tr('saveH')}</button></div></div>`;

/* ---- écran ---- */
const login=()=>`<form id="aF" class="lg"><img src="images/logo.png" alt="" onerror="this.style.display='none'"><h2>${tr('aTitle')}</h2><p>${tr('aSub')}</p><input id="aE" class="ip" type="email" placeholder="${tr('email')}" autocomplete="username" required><input id="aP" class="ip" type="password" placeholder="${tr('pwd')}" autocomplete="current-password" required><div class="er" id="aM"></div><button class="bt go" type="submit">${tr('enter')}</button></form>`;
function nav(){const N=$('#aN');N.hidden=!user;if(!user)return;const nw=newCount();N.innerHTML=[['o','🧾',tr('nO'),nw],['c','👥',tr('nC'),0],['s','📊',tr('nS'),0],['m','🍽',tr('nM'),0],['h','🕒',tr('nH'),0]].map(([k,i,l,b])=>`<button data-t="${k}" type="button" class="${tab===k?'on':''}"><span>${i}</span>${l}${b?`<em>${b}</em>`:''}</button>`).join('')}
function show(){const B=$('#aB');$('#aO').hidden=!user;paintHead();nav();badge();
if(!user){B.innerHTML=login();return}
if(tab==='o'){B.innerHTML=(snd?'':`<button class="warn" data-snd type="button">${tr('warnSnd')}</button>`)+`<div id="oS" class="kpis"></div><input id="oQ" class="sq" type="search" placeholder="${tr('search')}" value="${esc(q)}"><div id="oF" class="chips"></div><div id="oL" class="grid"></div>`;paintO()}
else B.innerHTML=tab==='c'?cHtml():tab==='s'?sHtml():tab==='m'?mHtml():hHtml();
B.scrollTop=0}
const save=async(f,v)=>{try{await setDoc(doc(db,'site','config'),{[f]:JSON.stringify(v),updated:serverTimestamp()},{merge:true});applyRemote(f==='menu'?clone(v):null,f==='hours'?clone(v):null);if(f==='menu'){dirty=false;show()}say(tr('saved'))}catch(e){alert('Erreur : '+(e.code||e.message))}};
const ticket=o=>{const w=open('','_blank','width=380,height=640');if(!w){say(tr('popup'));return}
w.document.write(`<!doctype html><meta charset="utf-8"><title>Ticket</title><style>body{font:14px monospace;width:72mm;margin:0 auto;padding:8px}h2{text-align:center;margin:4px 0}hr{border:0;border-top:1px dashed #000}p{margin:2px 0}.r{display:flex;justify-content:space-between}</style><h2>MON POTE</h2><p style="text-align:center">${esc(fullDt(ms(o)))} · #${esc(String(o.id).slice(-4).toUpperCase())}</p><hr><p><b>${esc(o.first)} ${esc(o.last)}</b></p><p>${esc(o.phone)}</p><p>${o.mode==='delivery'?'LIVRAISON':'Sur place / emporter'}</p>${o.addr?`<p>${esc(o.addr)}</p>`:''}<hr>${(o.items||[]).map(i=>`<p>${esc(i.q)} x ${esc(i.n)}</p>`).join('')}<hr>${o.note?`<p>Note : ${esc(o.note)}</p><hr>`:''}<div class="r"><b>TOTAL</b><b>${money(o.total)}</b></div>`);w.document.close();w.focus();setTimeout(()=>w.print(),250)};

A.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
if(b.id==='aX')location.hash='';
else if(b.id==='aO')signOut(auth);
else if(d.lg){lg=d.lg;try{localStorage.setItem('admLang',lg)}catch(e){}show()}
else if(b.id==='aS'||d.snd!==undefined)toggleSnd();
else if(d.t){tab=d.t;if(tab==='m'){M=clone(MENU);dirty=false}if(tab==='h')H=clone(HOURS);show()}
else if(d.f){filter=d.f;paintO()}
else if(d.st){updateDoc(doc(db,'orders',d.id),{status:d.st}).catch(()=>say(tr('neterr')))}
else if(d.pr){const o=orders.find(x=>x.id===d.pr);if(o)ticket(o)}
else if(d.del){if(confirm(tr('delQ')))deleteDoc(doc(db,'orders',d.del))}
else if(d.cat!==undefined){const i=Number(d.cat);openC.has(i)?openC.delete(i):openC.add(i);show()}
else if(d.rm){const[c,g,i]=d.rm.split('.').map(Number);if(confirm(tr('rmQ'))){M[c].groups[g].items.splice(i,1);dirty=true;show()}}
else if(d.add){const[c,g]=d.add.split('.').map(Number),G=M[c].groups[g];G.items.push([tr('newDish'),...Array(G.cols?G.cols.length:1).fill(0)]);dirty=true;show()}
else if(b.id==='mS'){if(M.some(c=>c.groups.some(g=>g.items.some(it=>!String(it[0]).trim()||it.slice(1).some(p=>!isFinite(p))))))alert(tr('chk'));else save('menu',M)}
else if(b.id==='hAll'){const f=H.find(Boolean);if(f){H=H.map(h=>h?[f[0],f[1]]:h);show()}}
else if(b.id==='hS')save('hours',H)});
A.addEventListener('submit',e=>{if(e.target.id!=='aF')return;e.preventDefault();$('#aM').textContent='';signInWithEmailAndPassword(auth,$('#aE').value.trim(),$('#aP').value).catch(()=>{$('#aM').textContent=tr('bad')})});
A.addEventListener('input',e=>{const t=e.target;
if(t.id==='cQ'){$('#cL').innerHTML=cList(t.value);return}
if(t.id==='oQ'){q=t.value;paintO();return}
const k=t.dataset.k;if(!k)return;const[c,g,i,j]=k.split('.').map(Number);M[c].groups[g].items[i][j]=j?parseFloat(t.value):t.value;dirty=true;const bar=$('#mBar');if(bar){bar.classList.add('dirty');$('#mTxt').textContent=tr('unsaved')}});
A.addEventListener('change',e=>{const d=e.target.dataset;if(d.hd!==undefined){H[d.hd]=e.target.checked?['11:00','00:00']:null;show()}else if(d.ho!==undefined)H[d.ho][0]=e.target.value;else if(d.hc!==undefined)H[d.hc][1]=e.target.value});
onAuthStateChanged(auth,u=>{user=u;if(unsub){unsub();unsub=null}orders=[];first=true;
if(u)unsub=onSnapshot(query(collection(db,'orders'),orderBy('createdAt','desc'),limit(500)),s=>{if(!first&&s.docChanges().some(c=>c.type==='added'))ring();first=false;orders=s.docs.map(d=>({id:d.id,...d.data()}));tally();nav();badge();if(tab==='o')paintO();else if(tab==='c'&&$('#cL'))$('#cL').innerHTML=cList($('#cQ').value);else if(tab==='s')show()},()=>{});show()});
const route=()=>{const on=location.hash==='#admin';A.hidden=!on;document.body.style.overflow=on?'hidden':'';if(on)show();badge()};
addEventListener('hashchange',route);route();
</script>
</body>
